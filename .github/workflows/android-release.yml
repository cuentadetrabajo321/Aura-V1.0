name: Aura Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Crear Keystore Fisico en la Raiz Real del Sistema
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/aura-release.keystore \
            -alias "androidreleasekey" \
            -keypass "android" \
            -storepass "android" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Aura, OU=Defens, O=Glitch, L=Caracas, S=Miranda, C=VE"
          
          # Copiar el archivo en todas las rutas posibles del contenedor para que Gradle lo vea sí o sí
          cp android/app/aura-release.keystore /home/runner/work/Aura-V1.0/Aura-V1.0/android/app/aura-release.keystore || true
          echo "Keystore replicado en los directorios base."

      - name: Dar permisos de ejecucion a las herramientas
        run: |
          chmod +x tool/compile_aura.sh || true
          chmod +x android/gradlew || true

      - name: Compilar APK de Producción con Variables Fijas Globales
        env:
          AURA_STORE_PASSWORD: "android"
          AURA_KEY_ALIAS: "androidreleasekey"
          AURA_KEY_PASSWORD: "android"
          AURA_KEYSTORE_PATH: "/home/runner/work/Aura-V1.0/Aura-V1.0/android/app/aura-release.keystore"
          AURA_PUBLIC_KEY_ENV: ${{ secrets.AURA_PUBLIC_KEY_ENV }}
          AURA_BUILD_FORMAT: "apk"
        run: bash tool/compile_aura.sh

      - name: Cargar APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Mobile-Defens-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          
